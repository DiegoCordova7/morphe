plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.morphe'
version = '1.0.0'

def useGitHubPackages = providers.gradleProperty('githubPackages')
        .map { it.toBoolean() }
        .getOrElse(false)

repositories {
    if (useGitHubPackages) {
        maven {
            name = 'GitHubAst'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-ast')

            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    } else {
        mavenLocal()
    }

    mavenCentral()
}

dependencies {
    api 'dev.morphe:morphe-ast:1.0.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'Morphe Semantic'
                description = 'Semantic analysis component for the Morphe programming language.'
                url = 'https://github.com/DiegoCordova7/morphe-semantic'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        distribution = 'repo'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/DiegoCordova7/morphe-semantic.git'
                    developerConnection = 'scm:git:ssh://github.com/DiegoCordova7/morphe-semantic.git'
                    url = 'https://github.com/DiegoCordova7/morphe-semantic'
                }

                developers {
                    developer {
                        id = 'DiegoCordova'
                        name = 'DiegoCordova'
                        email = 'diegocordovaprogramacion@gmail.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-semantic')

            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

test {
    useJUnitPlatform()
}