
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.morphe'
version = '0.0.1-SNAPSHOT'
description = 'morphe-api'

def useGitHubPackages = providers.gradleProperty('githubPackages')
        .map { it.toBoolean() }
        .getOrElse(false)

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    if (useGitHubPackages) {
        maven {
            name = 'GitHubVM'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-vm')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }

        maven {
            name = 'GitHubEngine'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-engine')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    } else {
        mavenLocal()
    }

    mavenCentral()
}

dependencies {
    implementation 'io.github.diegocordova7:morphe-vm:1.0.0'
    implementation 'dev.morphe:morphe-engine:1.0.0'
    implementation 'dev.morphe:morphe-metrics:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}