# Morphe execution limits
morphe.execution.timeout-seconds=5
morphe.execution.max-output-lines=500
morphe.execution.pool-size=4

# CORS: in production, replace "*" with your real domains, comma-separated.
# Example: morphe.cors.allowed-origins=https://your-username.github.io,https://morphe-lang.dev
morphe.cors.allowed-origins=*

# Tomcat: capping threads avoids a traffic spike exhausting memory on a free tier
server.tomcat.threads.max=50