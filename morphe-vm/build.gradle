
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.diegocordova7'
version = '1.0.0'

def useGitHubPackages = providers.gradleProperty('githubPackages')
        .map { it.toBoolean() }
        .getOrElse(false)

repositories {
    if (useGitHubPackages) {
        maven {
            name = 'GitHubBytecode'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-bytecode')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }

        maven {
            name = 'GitHubRuntime'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-runtime')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    } else {
        mavenLocal()
    }

    mavenCentral()
}

dependencies {
    api 'io.github.diegocordova7:morphe-bytecode:1.0.0'
    api 'io.github.diegocordova7:morphe-runtime:1.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'Morphe VM'
                description = 'Virtual machine for the Morphe programming language.'
                url = 'https://github.com/DiegoCordova7/morphe-vm'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        distribution = 'repo'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/DiegoCordova7/morphe-vm.git'
                    developerConnection = 'scm:git:ssh://github.com/DiegoCordova7/morphe-vm.git'
                    url = 'https://github.com/DiegoCordova7/morphe-vm'
                }

                developers {
                    developer {
                        id = 'DiegoCordova'
                        name = 'DiegoCordova'
                        email = 'diegocordovaprogramacion@gmail.com'
                    }
                }
            }
        }
    }

    repositories {
        if (useGitHubPackages) {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-vm')

                credentials {
                    username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
}