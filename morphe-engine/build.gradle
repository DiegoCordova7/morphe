plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.morphe'
version = '1.0.0'

def useGitHubPackages = providers.gradleProperty('githubPackages')
        .map { it.toBoolean() }
        .getOrElse(false)

repositories {
    if (useGitHubPackages) {
        maven {
            name = 'GitHubLexer'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-lexer')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubParser'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-parser')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubAst'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-ast')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubSemantic'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-semantic')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubCompiler'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-compiler')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubBytecode'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-bytecode')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubVm'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-vm')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
        maven {
            name = 'GitHubRuntime'
            url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-runtime')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    } else {
        mavenLocal()
    }

    mavenCentral()
}

dependencies {
    api 'dev.morphe:morphe-lexer:1.0.0'
    api 'dev.morphe:morphe-parser:1.0.0'
    api 'dev.morphe:morphe-ast:1.0.0'
    api 'dev.morphe:morphe-semantic:1.0.0'
    api 'dev.morphe:morphe-compiler:1.0.0'
    api 'io.github.diegocordova7:morphe-bytecode:1.0.0'
    api 'io.github.diegocordova7:morphe-vm:1.0.0'
    api 'io.github.diegocordova7:morphe-runtime:1.0.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        if (useGitHubPackages) {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe-engine')
                credentials {
                    username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
}