plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':morphe-engine')
    api project(':morphe-bytecode')
    implementation 'org.postgresql:postgresql:42.7.5'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'Morphe Metrics'
                description = 'Metrics collection and persistence for the Morphe programming language.'
                url = 'https://github.com/DiegoCordova7/morphe'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        distribution = 'repo'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/DiegoCordova7/morphe.git'
                    developerConnection = 'scm:git:ssh://github.com/DiegoCordova7/morphe.git'
                    url = 'https://github.com/DiegoCordova7/morphe'
                }

                developers {
                    developer {
                        id = 'DiegoCordova'
                        name = 'DiegoCordova'
                        email = 'diegocordovaprogramacion@gmail.com'
                    }
                }
            }
        }
    }

    repositories {
        def useGitHubPackages = providers.gradleProperty('githubPackages')
                .map { it.toBoolean() }
                .getOrElse(false)

        if (useGitHubPackages) {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe')
                credentials {
                    username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}