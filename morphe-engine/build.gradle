plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.morphe'
version = '1.0.0'

dependencies {
    api project(':morphe-lexer')
    api project(':morphe-parser')
    api project(':morphe-ast')
    api project(':morphe-semantic')
    api project(':morphe-compiler')
    api project(':morphe-bytecode')
    api project(':morphe-vm')
    api project(':morphe-runtime')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        def useGitHubPackages = providers.gradleProperty('githubPackages')
                .map { it.toBoolean() }
                .getOrElse(false)

        if (useGitHubPackages) {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/DiegoCordova7/morphe')
                credentials {
                    username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                    password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
}